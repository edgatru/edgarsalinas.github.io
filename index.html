<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta name="description" content="Edgar Salinas — Técnico de soporte informático para particulares.">
<title>Edgar Salinas | Soporte informático</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#020914;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.card{
  position:relative;
  width:100%;
  max-width:1024px;
  line-height:0;
}

.card img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* ZONAS INTERACTIVAS */
.hotspot{
  position:absolute;
  display:block;
  background:transparent;
  border:0;
  outline:0;
  padding:0;
  margin:0;
  cursor:pointer;
  z-index:10;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* Botones */
.whatsapp{
  left:7%;
  top:60.85%;
  width:86%;
  height:4.55%;
}

.call{
  left:7%;
  top:65.80%;
  width:86%;
  height:4.55%;
}

.remote{
  left:7%;
  top:70.72%;
  width:86%;
  height:4.62%;
}

.contact{
  left:7%;
  top:75.72%;
  width:86%;
  height:4.62%;
}

/* QR */
.qr{
  left:11%;
  top:81%;
  width:20%;
  height:10.8%;
}

/* Email */
.mail{
  left:34%;
  top:81%;
  width:56%;
  height:10.8%;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
</style>
</head>

<body>

<main class="card" aria-label="Tarjeta digital de Edgar Salinas">

<img
  src="tarjeta-aprobada-QR-verificado.png"
  alt="Tarjeta digital de Edgar Salinas, técnico de soporte informático para particulares"
>

<!-- WHATSAPP -->
<a
  class="hotspot whatsapp"
  href="https://wa.me/34646858922?text=Hola%20Edgar%2C%20he%20visto%20tu%20tarjeta%20y%20necesito%20ayuda%20inform%C3%A1tica."
  target="_blank"
  rel="noopener"
  aria-label="Contactar por WhatsApp"
>
<span class="sr-only">WhatsApp</span>
</a>

<!-- LLAMAR -->
<a
  class="hotspot call"
  href="tel:+34646858922"
  aria-label="Llamar a Edgar Salinas"
>
<span class="sr-only">Llamar</span>
</a>

<!-- AYUDA REMOTA -->
<a
  class="hotspot remote"
  href="ayuda-remota.html"
  aria-label="Solicitar ayuda remota"
>
<span class="sr-only">Ayuda remota</span>
</a>

<!-- GUARDAR CONTACTO -->
<a
  class="hotspot contact"
  href="contact.vcf"
  download="Edgar-Salinas.vcf"
  aria-label="Guardar contacto"
>
<span class="sr-only">Guardar contacto</span>
</a>

<!-- QR -->
<a
  class="hotspot qr"
  href="./"
  aria-label="Abrir tarjeta digital"
>
<span class="sr-only">Código QR</span>
</a>

<!-- EMAIL -->
<a
  class="hotspot mail"
  href="mailto:informaticoparaparticulares@gmail.com?subject=Solicitud%20de%20soporte%20inform%C3%A1tico"
  aria-label="Enviar email"
>
<span class="sr-only">Email</span>
</a>

</main>

</body>
</html>
