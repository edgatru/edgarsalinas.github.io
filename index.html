<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
      maximum-scale=1">

<meta name="theme-color" content="#020914">

<title>Edgar Salinas | Soporte informático</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#020914;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.card{
    position:relative;
    width:100%;
    max-width:1024px;
}

.card img{
    display:block;
    width:100%;
    height:auto;
    margin:0;
    padding:0;
    border:0;
}

/* ZONAS */

.boton{
    position:absolute;
    left:6.7%;
    width:86.6%;
    display:block;
    z-index:100;
    background:rgba(255,0,0,0);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

/* WHATSAPP */
#whatsapp{
    top:60.8%;
    height:4.6%;
}

/* LLAMAR */
#llamar{
    top:65.7%;
    height:4.6%;
}

/* AYUDA REMOTA */
#remota{
    top:70.65%;
    height:4.65%;
}

/* CONTACTO */
#contacto{
    top:75.65%;
    height:4.65%;
}

/* QR */
#qr{
    left:8%;
    top:81.0%;
    width:25%;
    height:10.8%;
}

</style>
</head>

<body>

<div class="card">

<img
    src="tarjeta-aprobada-QR-verificado.png?v=6"
    alt="Tarjeta digital de Edgar Salinas"
>

<!-- WHATSAPP -->
<div
    id="whatsapp"
    class="boton"
    onclick="irWhatsApp(event)"
    ontouchend="irWhatsApp(event)">
</div>

<!-- LLAMAR -->
<div
    id="llamar"
    class="boton"
    onclick="llamar(event)"
    ontouchend="llamar(event)">
</div>

<!-- AYUDA REMOTA -->
<div
    id="remota"
    class="boton"
    onclick="ayudaRemota(event)"
    ontouchend="ayudaRemota(event)">
</div>

<!-- CONTACTO -->
<div
    id="contacto"
    class="boton"
    onclick="guardarContacto(event)"
    ontouchend="guardarContacto(event)">
</div>

<!-- QR -->
<div
    id="qr"
    class="boton"
    onclick="abrirTarjeta(event)"
    ontouchend="abrirTarjeta(event)">
</div>

</div>

<script>

let ultimoToque = 0;

function evitarDoble(event){
    event.preventDefault();
    event.stopPropagation();

    const ahora = Date.now();

    if(ahora - ultimoToque < 500){
        return false;
    }

    ultimoToque = ahora;

    return true;
}

function irWhatsApp(event){

    if(!evitarDoble(event)) return;

    window.location.href =
    "https://wa.me/34646858922?text=Hola%20Edgar%2C%20he%20visto%20tu%20tarjeta%20y%20necesito%20ayuda%20inform%C3%A1tica.";
}

function llamar(event){

    if(!evitarDoble(event)) return;

    window.location.href =
    "tel:+34646858922";
}

function ayudaRemota(event){

    if(!evitarDoble(event)) return;

    window.location.href =
    "ayuda-remota.html";
}

function guardarContacto(event){

    if(!evitarDoble(event)) return;

    window.location.href =
    "contact.vcf";
}

function abrirTarjeta(event){

    if(!evitarDoble(event)) return;

    window.location.href =
    "./";
}

</script>

</body>
</html>
